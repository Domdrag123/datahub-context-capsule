[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "datahub-context-capsule"
version = "0.1.0"
description = "A bounded DataHub MCP context compiler for safer data agents."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Definitive BountyHunter"}]
dependencies = ["mcp>=1.26,<2"]

[project.scripts]
context-capsule = "context_capsule.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

